server {
  # Same port as the dev/preview setup, so docker-compose's 5173 mapping is unchanged.
  listen 5173;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build files never change — let browsers cache them for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routes (/tasks, /login, …) all serve index.html; React Router takes over.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
