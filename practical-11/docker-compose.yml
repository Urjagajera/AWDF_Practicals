# Whole Task Management stack: docker-compose up --build
#   frontend → http://localhost:5173   (React, production build)
#   backend  → http://localhost:5000   (Express API)
#   mongodb  → internal; published on host port 27018 so it doesn't clash with a local MongoDB
# Host ports can be changed with FRONTEND_PORT / BACKEND_PORT / MONGO_PORT.

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    networks:
      - app-network

  backend:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 5000
      # "mongodb" is the service name above — Docker's DNS resolves it inside app-network.
      # localhost here would mean the backend container itself.
      MONGO_URI: mongodb://mongodb:27017/taskdb
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      - mongodb
    networks:
      - app-network

  frontend:
    build: ./client
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
