name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # The API tests need a real MongoDB; GitHub starts this container next to the job.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # The repo is an npm workspace, so dependencies are installed once at the root.
      - run: npm install

      - name: Run Practical 12 API tests
        run: npm test -w practical-12/server
        env:
          MONGO_URI: mongodb://localhost:27017/awdf_p12_test
